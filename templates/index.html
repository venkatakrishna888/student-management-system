<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Student Management Dashboard</h2>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>

    <div class="d-flex justify-content-between mb-3">
        <a href="/add" class="btn btn-primary">Add Student</a>

        <form method="POST" class="d-flex">
            <input type="text" name="search" class="form-control me-2" placeholder="Search student..." required>
            <button type="submit" class="btn btn-success">Search</button>
            <a href="/" class="btn btn-secondary ms-2">Clear</a>
        </form>
    </div>

    <div class="card shadow">
        <div class="card-body">

            <table class="table table-hover text-center align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for student in students %}
                    <tr>
                        <td>{{ student[0] }}</td>
                        <td>{{ student[1] }}</td>
                        <td>{{ student[2] }}</td>
                        <td>{{ student[3] }}</td>
                        <td>{{ student[4] }}</td>
                        <td>
                            <a href="/edit/{{ student[0] }}" class="btn btn-warning btn-sm">Edit</a>
                            <a href="/delete/{{ student[0] }}" class="btn btn-danger btn-sm">Delete</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

        </div>
    </div>

</div>

</body>
</html>
